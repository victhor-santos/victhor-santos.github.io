<svg font-family="Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">AI-Powered Delivery Platform</title><desc id="desc">Backend implementado e roadmap de Intelligent Route Optimization</desc><defs><radialGradient id="bg"><stop stop-color="#1b201d"/><stop offset="1" stop-color="#090b0a"/></radialGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><path d="M0 112 H1600" stroke="#2b302d"/><text x="45" y="61" fill="#fff" font-size="38" font-weight="750">AI-Powered Delivery Platform</text><rect x="45" y="80" width="510" height="5" rx="3" fill="#c5f567"/><text x="45" y="105" fill="#aeb6af" font-size="17">Backend implementado e roadmap de Intelligent Route Optimization</text>
