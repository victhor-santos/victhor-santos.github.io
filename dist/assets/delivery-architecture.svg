<text x="850" y="902" fill="#aeb6af" font-size="16">ML estima os pesos; Dijkstra/A* encontra o caminho no grafo.</text><text x="1555" y="965" text-anchor="end" fill="#646c66" font-size="14">VICTHOR SANTOS · ARQUITETURA DO PROJETO</text></svg>